format: hyge-pack
version: 1

name: shell-characterization
description: Characterization rules exposing unresolved proof-capability obligations for outer logical shells.
origin: primitive

# D11 shell frontier. These are pack-local constructor-head mappings only.
# Each diagnostic describes one concrete capability requirement from a matching
# outer shell. Diagnostic entries never enter the proof-rule collection.
surface:
  NosolutionsIntroductionLabel: nosolutions
  ForallImpliesDecompositionLabel: forall
  NeedContradictionFromArbitrarySolutionLabel: NeedContradictionFromArbitrarySolution
  NeedBinderSafeImplicationLabel: NeedBinderSafeImplication

phi:
  list: []

diagnostics:
  - id: nosolutions_introduction
    requirement:
      call:
        head: {sym: NeedContradictionFromArbitrarySolutionLabel}
        args:
          - {var: domain}
          - {var: unknowns}
          - {var: equation}
    shell:
      call:
        head: {sym: NosolutionsIntroductionLabel}
        args:
          - {var: domain}
          - {var: unknowns}
          - {var: equation}

  - id: forall_implies_decomposition
    requirement:
      call:
        head: {sym: NeedBinderSafeImplicationLabel}
        args:
          - {var: variable}
          - {var: antecedent}
          - {var: consequent}
    shell:
      call:
        head: {sym: ForallImpliesDecompositionLabel}
        args:
          - {var: variable}
          - call:
              head: {char: implies}
              args:
                - {var: antecedent}
                - {var: consequent}
