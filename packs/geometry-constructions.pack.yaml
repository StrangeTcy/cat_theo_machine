format: hyge-pack
version: 1

name: geometry-constructions
description: >
  W8. Generic inference schemas that consume auxiliary constructions. Every
  rule here is fully variable-typed: no rule names a point, a triangle, a
  problem, or a known auxiliary object, and no rule concludes anything that
  was not already asked for by a goal shape the construction generator
  serves. The schemas they serve are machine terms built by
  `constructions.py`; a proposal mints the auxiliary object, obligationes the
  effect facts, and only then do these rules have anything to consume.

    bisector_splits_angle      a constructed apex bisector halves the apex
                               angle (definitional)
    sas_self_congruence        two sub-triangles on equal flanks with the
                               contained angle equal are congruent, so the
                               corresponding base angles are equal
    on_segment_unifies_ray     a point on a segment defines the same ray from
                               the segment's endpoint as the segment itself,
                               so it does not split the angle there; the apex
                               comes from a triangle premise, never free
    equal_angle_symmetric      angle equality is symmetric
    equal_angle_transitive     angle equality is transitive
    circumcircle_admits_vertex every vertex of a triangle lies on the
                               triangle's circumcircle

  W26 adds three chord/angle schemas over the same ontology:

    inscribed_angles_same_arc   two points that see a chord from the same
                               side of it see it at equal angles (the side
                               condition is a real premise: opposite sides
                               give supplementary angles, not equal ones)
    cyclic_order_opposite_angles opposite angles of a cyclic quadrilateral
                               are supplementary; the cyclic order is what
                               makes four points on a circle a quadrilateral
    semicircle_angle_is_right   a chord that is a diameter is seen at a right
                               angle from every other point of the circle
                               (Thales), stated without a measure constant

requires:
  - geometry-ontology

phi:
  list: []

rules:
  - id: bisector_splits_angle
    premises:
      - call:
          head: {sym: BisectorFromLabel}
          args: [{var: a}, {var: d}, {var: b}, {var: c}]
    replacement:
      list:
        - call:
            head: {sym: EqualAngleLabel}
            args:
              - call:
                  head: {sym: AngleLabel}
                  args: [{var: b}, {var: a}, {var: d}]
              - call:
                  head: {sym: AngleLabel}
                  args: [{var: d}, {var: a}, {var: c}]

  - id: sas_self_congruence
    premises:
      - call:
          head: {sym: TriangleLabel}
          args: [{var: a}, {var: b}, {var: d}]
      - call:
          head: {sym: TriangleLabel}
          args: [{var: a}, {var: c}, {var: d}]
      - call:
          head: {sym: LengthLabel}
          args:
            - call:
                head: {sym: SegmentLabel}
                args: [{var: a}, {var: b}]
            - {var: x}
      - call:
          head: {sym: LengthLabel}
          args:
            - call:
                head: {sym: SegmentLabel}
                args: [{var: a}, {var: c}]
            - {var: x}
      - call:
          head: {sym: EqualAngleLabel}
          args:
            - call:
                head: {sym: AngleLabel}
                args: [{var: b}, {var: a}, {var: d}]
            - call:
                head: {sym: AngleLabel}
                args: [{var: d}, {var: a}, {var: c}]
    replacement:
      list:
        - call:
            head: {sym: EqualAngleLabel}
            args:
              - call:
                  head: {sym: AngleLabel}
                  args: [{var: a}, {var: b}, {var: d}]
              - call:
                  head: {sym: AngleLabel}
                  args: [{var: a}, {var: c}, {var: d}]

  - id: on_segment_unifies_ray
    # A point on a segment defines the same ray from the segment's endpoint
    # as the segment itself, so it does not split the angle there. The apex
    # is bound by a triangle premise: a replacement may never introduce a
    # variable no premise bound.
    premises:
      - call:
          head: {sym: PointOnLabel}
          args:
            - {var: d}
            - call:
                head: {sym: SegmentLabel}
                args: [{var: v}, {var: w}]
      - call:
          head: {sym: TriangleLabel}
          args: [{var: u}, {var: v}, {var: d}]
    replacement:
      list:
        - call:
            head: {sym: EqualAngleLabel}
            args:
              - call:
                  head: {sym: AngleLabel}
                  args: [{var: u}, {var: v}, {var: d}]
              - call:
                  head: {sym: AngleLabel}
                  args: [{var: u}, {var: v}, {var: w}]

  - id: equal_angle_symmetric
    premises:
      - call:
          head: {sym: EqualAngleLabel}
          args: [{var: p}, {var: q}]
    replacement:
      list:
        - call:
            head: {sym: EqualAngleLabel}
            args: [{var: q}, {var: p}]

  - id: equal_angle_transitive
    premises:
      - call:
          head: {sym: EqualAngleLabel}
          args: [{var: p}, {var: q}]
      - call:
          head: {sym: EqualAngleLabel}
          args: [{var: q}, {var: r}]
    replacement:
      list:
        - call:
            head: {sym: EqualAngleLabel}
            args: [{var: p}, {var: r}]

  - id: circumcircle_admits_vertex
    premises:
      - call:
          head: {sym: CircumcircleOfLabel}
          args: [{var: k}, {var: t}]
      - call:
          head: {sym: VertexOfLabel}
          args: [{var: t}, {var: v}]
    replacement:
      list:
        - call:
            head: {sym: OnCircleLabel}
            args: [{var: v}, {var: k}]

  # ------------------------------------------------------------------
  # W26: chord / angle remainder.  Same discipline as W8 -- every rule is
  # fully variable-typed, names no point, circle or problem, and carries no
  # constant.  `inscribed_angles_same_arc` needs its side condition: with the
  # two points on opposite sides of the chord the angles are supplementary,
  # not equal, so the rule would be unsound without it and does not fire.
  # ------------------------------------------------------------------

  - id: inscribed_angles_same_arc
    premises:
      - call:
          head: {sym: OnCircleLabel}
          args: [{var: a}, {var: k}]
      - call:
          head: {sym: OnCircleLabel}
          args: [{var: b}, {var: k}]
      - call:
          head: {sym: OnCircleLabel}
          args: [{var: c}, {var: k}]
      - call:
          head: {sym: OnCircleLabel}
          args: [{var: d}, {var: k}]
      - call:
          head: {sym: SameSideOfLineLabel}
          args:
            - {var: c}
            - {var: d}
            - call:
                head: {sym: SegmentLabel}
                args: [{var: a}, {var: b}]
    replacement:
      list:
        - call:
            head: {sym: EqualAngleLabel}
            args:
              - call:
                  head: {sym: AngleLabel}
                  args: [{var: a}, {var: c}, {var: b}]
              - call:
                  head: {sym: AngleLabel}
                  args: [{var: a}, {var: d}, {var: b}]

  - id: cyclic_order_opposite_angles
    # A cyclic order is what makes the four points a quadrilateral rather
    # than four points on a circle; opposite angles are then supplementary.
    premises:
      - call:
          head: {sym: CyclicOrderLabel}
          args: [{var: a}, {var: b}, {var: c}, {var: d}, {var: k}]
    replacement:
      list:
        - call:
            head: {sym: SupplementaryAnglesLabel}
            args:
              - call:
                  head: {sym: AngleLabel}
                  args: [{var: a}, {var: b}, {var: c}]
              - call:
                  head: {sym: AngleLabel}
                  args: [{var: c}, {var: d}, {var: a}]

  - id: semicircle_angle_is_right
    # Thales: a chord that is a diameter is seen at a right angle from every
    # other point of the circle.  Stated relationally (perpendicular
    # segments), so the rule needs no measure constant.
    premises:
      - call:
          head: {sym: DiameterLineLabel}
          args:
            - {var: k}
            - call:
                head: {sym: SegmentLabel}
                args: [{var: a}, {var: b}]
      - call:
          head: {sym: OnCircleLabel}
          args: [{var: c}, {var: k}]
    replacement:
      list:
        - call:
            head: {sym: PerpendicularLabel}
            args:
              - call:
                  head: {sym: SegmentLabel}
                  args: [{var: c}, {var: a}]
              - call:
                  head: {sym: SegmentLabel}
                  args: [{var: c}, {var: b}]
