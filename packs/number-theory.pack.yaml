format: hyge-pack
version: 1

name: number-theory
description: Divisibility, parity, modulo and gcd as knowledge-rewrite laws (rung 1 of the curriculum ladder)
requires: []

phi:
  list: []

# Knowledge-board rules in the engel style: premises are consumed by
# the firing, the replacement is the new board contribution. Two
# measured constraints shape this pack. Re-asserting all premises in
# every replacement stalls search (a one-step proof passed 540 s; the
# consuming form proves it in ~4 s). And bidirectional definitional
# pairs (even <-> divides) would create two-cycles the search re-enters
# forever -- so the pack speaks ONE canonical direction: Divides is the
# hub, and parity, modulo and gcd all translate INTO divisibility
# language. Rendering divisibility back into parity words is the talk
# side's job, not a search rule.
#
# A third constraint gates the exercises: divides_sum,
# divides_product, mul_one_fold and mul_succ_fold are GENERATIVE --
# they mint terms (Divides(3, 6+9) enables Divides(3, 6+(6+9)) without
# end), so saturating search over them diverges by construction
# (measured: OOM at 4 GB). They are exercised by directed application
# -- one JoinPremises, one ApplyKnowledgeRewrite, goal coverage
# checked -- the consumption pattern rung 2's obligation discharge
# uses.
rules:
  - id: even_means_two_divides
    premises:
      - call:
          head: {sym: EvenPropLabel}
          args: [{var: n}]
    replacement:
      list:
        - call:
            head: {sym: DividesLabel}
            args: [{sym: two}, {var: n}]

  - id: divides_transitive
    premises:
      - call:
          head: {sym: DividesLabel}
          args: [{var: a}, {var: b}]
      - call:
          head: {sym: DividesLabel}
          args: [{var: b}, {var: c}]
    replacement:
      list:
        - call:
            head: {sym: DividesLabel}
            args: [{var: a}, {var: c}]

  - id: divides_sum
    premises:
      - call:
          head: {sym: DividesLabel}
          args: [{var: a}, {var: b}]
      - call:
          head: {sym: DividesLabel}
          args: [{var: a}, {var: c}]
    replacement:
      list:
        - call:
            head: {sym: DividesLabel}
            args:
              - {var: a}
              - call:
                  head: {sym: ExprAddLabel}
                  args: [{var: b}, {var: c}]

  - id: divides_product
    premises:
      - call:
          head: {sym: DividesLabel}
          args: [{var: a}, {var: b}]
      - call:
          head: {sym: DividesLabel}
          args: [{var: c}, {var: d}]
    replacement:
      list:
        - call:
            head: {sym: DividesLabel}
            args:
              - call:
                  head: {sym: ExprMulLabel}
                  args: [{var: a}, {var: c}]
              - call:
                  head: {sym: ExprMulLabel}
                  args: [{var: b}, {var: d}]

  # a = a * 1, folding direction only (the unfold would two-cycle).
  # This is the base-case lemma of rung-2 induction at base one.
  - id: mul_one_fold
    premises:
      - call:
          head: {sym: DividesLabel}
          args: [{var: x}, {var: a}]
    replacement:
      list:
        - call:
            head: {sym: DividesLabel}
            args:
              - {var: x}
              - call:
                  head: {sym: ExprMulLabel}
                  args:
                    - {var: a}
                    - call:
                        head: {sym: SuccLabel}
                        args: [{sym: Zero}]

  # Distribution at the fact level, folding direction only: a divisor
  # of a*b + a divides a*(b+1). The unfold direction would pair with
  # this into a two-cycle (the measured OOM class), so it stays out.
  # This is the step-case lemma of rung-2 induction: the hypothesis
  # Divides(x, Mul(a, k)) plus Divides(x, a) reach the successor
  # through divides_sum and this fold.
  - id: mul_succ_fold
    premises:
      - call:
          head: {sym: DividesLabel}
          args:
            - {var: x}
            - call:
                head: {sym: ExprAddLabel}
                args:
                  - call:
                      head: {sym: ExprMulLabel}
                      args: [{var: a}, {var: b}]
                  - {var: a}
    replacement:
      list:
        - call:
            head: {sym: DividesLabel}
            args:
              - {var: x}
              - call:
                  head: {sym: ExprMulLabel}
                  args:
                    - {var: a}
                    - call:
                        head: {sym: SuccLabel}
                        args: [{var: b}]

  - id: zero_remainder_means_divides
    premises:
      - call:
          head: {sym: ModuloLabel}
          args: [{var: n}, {var: m}, {sym: Zero}]
    replacement:
      list:
        - call:
            head: {sym: DividesLabel}
            args: [{var: m}, {var: n}]

  - id: gcd_divides_both
    premises:
      - call:
          head: {sym: GcdLabel}
          args: [{var: a}, {var: b}, {var: g}]
    replacement:
      list:
        - call:
            head: {sym: DividesLabel}
            args: [{var: g}, {var: a}]
        - call:
            head: {sym: DividesLabel}
            args: [{var: g}, {var: b}]

examples:
  # Goals are the end board: what the firing chain leaves behind.
  - id: nt_even_to_divides
    start:
      call:
        head: {sym: KnowledgeLabel}
        args:
          - list:
              - call:
                  head: {sym: EvenPropLabel}
                  args: [{sym: six}]
    goal:
      call:
        head: {sym: KnowledgeLabel}
        args:
          - list:
              - call:
                  head: {sym: DividesLabel}
                  args: [{sym: two}, {sym: six}]

  - id: nt_divides_transitive
    start:
      call:
        head: {sym: KnowledgeLabel}
        args:
          - list:
              - call:
                  head: {sym: DividesLabel}
                  args: [{sym: two}, {sym: four}]
              - call:
                  head: {sym: DividesLabel}
                  args: [{sym: four}, {sym: eight}]
    goal:
      call:
        head: {sym: KnowledgeLabel}
        args:
          - list:
              - call:
                  head: {sym: DividesLabel}
                  args: [{sym: two}, {sym: eight}]

  - id: nt_divides_sum
    start:
      call:
        head: {sym: KnowledgeLabel}
        args:
          - list:
              - call:
                  head: {sym: DividesLabel}
                  args: [{sym: three}, {sym: six}]
              - call:
                  head: {sym: DividesLabel}
                  args: [{sym: three}, {sym: nine}]
    goal:
      call:
        head: {sym: KnowledgeLabel}
        args:
          - list:
              - call:
                  head: {sym: DividesLabel}
                  args:
                    - {sym: three}
                    - call:
                        head: {sym: ExprAddLabel}
                        args: [{sym: six}, {sym: nine}]

  - id: nt_divides_product
    start:
      call:
        head: {sym: KnowledgeLabel}
        args:
          - list:
              - call:
                  head: {sym: DividesLabel}
                  args: [{sym: two}, {sym: four}]
              - call:
                  head: {sym: DividesLabel}
                  args: [{sym: three}, {sym: nine}]
    goal:
      call:
        head: {sym: KnowledgeLabel}
        args:
          - list:
              - call:
                  head: {sym: DividesLabel}
                  args:
                    - call:
                        head: {sym: ExprMulLabel}
                        args: [{sym: two}, {sym: three}]
                    - call:
                        head: {sym: ExprMulLabel}
                        args: [{sym: four}, {sym: nine}]

  - id: nt_mod_zero_to_divides
    start:
      call:
        head: {sym: KnowledgeLabel}
        args:
          - list:
              - call:
                  head: {sym: ModuloLabel}
                  args: [{sym: nine}, {sym: three}, {sym: Zero}]
    goal:
      call:
        head: {sym: KnowledgeLabel}
        args:
          - list:
              - call:
                  head: {sym: DividesLabel}
                  args: [{sym: three}, {sym: nine}]

  - id: nt_gcd_divides_both
    start:
      call:
        head: {sym: KnowledgeLabel}
        args:
          - list:
              - call:
                  head: {sym: GcdLabel}
                  args: [{sym: four}, {sym: six}, {sym: two}]
    goal:
      call:
        head: {sym: KnowledgeLabel}
        args:
          - list:
              - call:
                  head: {sym: DividesLabel}
                  args: [{sym: two}, {sym: four}]
              - call:
                  head: {sym: DividesLabel}
                  args: [{sym: two}, {sym: six}]

  # Two-step chain: parity becomes divisibility, then transitivity
  # carries it through an already-known divisibility.
  - id: nt_even_chain
    start:
      call:
        head: {sym: KnowledgeLabel}
        args:
          - list:
              - call:
                  head: {sym: EvenPropLabel}
                  args: [{sym: four}]
              - call:
                  head: {sym: DividesLabel}
                  args: [{sym: four}, {sym: eight}]
    goal:
      call:
        head: {sym: KnowledgeLabel}
        args:
          - list:
              - call:
                  head: {sym: DividesLabel}
                  args: [{sym: two}, {sym: eight}]

  # Two-step chain: zero remainder becomes divisibility, then
  # transitivity through a recorded divisor.
  - id: nt_mod_chain
    start:
      call:
        head: {sym: KnowledgeLabel}
        args:
          - list:
              - call:
                  head: {sym: ModuloLabel}
                  args: [{sym: six}, {sym: three}, {sym: Zero}]
              - call:
                  head: {sym: DividesLabel}
                  args: [{sym: one}, {sym: three}]
    goal:
      call:
        head: {sym: KnowledgeLabel}
        args:
          - list:
              - call:
                  head: {sym: DividesLabel}
                  args: [{sym: one}, {sym: six}]

  # Three-step chain: gcd projects both divisibilities, then the sum
  # lemma combines them.
  - id: nt_gcd_sum_chain
    start:
      call:
        head: {sym: KnowledgeLabel}
        args:
          - list:
              - call:
                  head: {sym: GcdLabel}
                  args: [{sym: four}, {sym: six}, {sym: two}]
    goal:
      call:
        head: {sym: KnowledgeLabel}
        args:
          - list:
              - call:
                  head: {sym: DividesLabel}
                  args:
                    - {sym: two}
                    - call:
                        head: {sym: ExprAddLabel}
                        args: [{sym: four}, {sym: six}]

  # One-way square-root factor lemma.  The successor form is the existing
  # strict NatLess encoding of i <= Sqrt(n); Divides keeps its canonical
  # divisor, number argument order.  The existential witness remains
  # symbolic, so this rule cannot enumerate a divisor family.
  - id: composite_has_nontrivial_sqrt_bounded_divisor
    premises:
      - call:
          head: {sym: CompositeLabel}
          args: [{var: n}]
      - call:
          head: {sym: NatLessLabel}
          args: [{sym: one}, {var: n}]
    replacement:
      list:
        - call:
            head: {sym: ExistsLabel}
            args:
              - call:
                  head: {sym: NontrivialDivisorLabel}
                  args:
                    - {var: i}
                    - {var: n}
                    - call:
                        head: {sym: SqrtLabel}
                        args: [{var: n}]
                    - call:
                        head: {sym: DividesLabel}
                        args: [{var: i}, {var: n}]
                    - call:
                        head: {sym: NatLessLabel}
                        args: [{sym: one}, {var: i}]
                    - call:
                        head: {sym: NatLessLabel}
                        args:
                          - {var: i}
                          - call:
                              head: {sym: SuccLabel}
                              args:
                                - call:
                                    head: {sym: SqrtLabel}
                                    args: [{var: n}]

examples:
  - id: nt_composite_sqrt_factor_directed
    start:
      call:
        head: {sym: KnowledgeLabel}
        args:
          - list:
              - call:
                  head: {sym: CompositeLabel}
                  args: [{sym: six}]
              - call:
                  head: {sym: NatLessLabel}
                  args: [{sym: one}, {sym: six}]
    goal:
      call:
        head: {sym: KnowledgeLabel}
        args:
          - list:
              - call:
                  head: {sym: ExistsLabel}
                  args:
                    - call:
                        head: {sym: NontrivialDivisorLabel}
                        args:
                          - {var: i}
                          - {sym: six}
                          - call:
                              head: {sym: SqrtLabel}
                              args: [{sym: six}]
                          - call:
                              head: {sym: DividesLabel}
                              args: [{var: i}, {sym: six}]
                          - call:
                              head: {sym: NatLessLabel}
                              args: [{sym: one}, {var: i}]
                          - call:
                              head: {sym: NatLessLabel}
                              args:
                                - {var: i}
                                - call:
                                    head: {sym: SuccLabel}
                                    args:
                                      - call:
                                          head: {sym: SqrtLabel}
                                          args: [{sym: six}]
